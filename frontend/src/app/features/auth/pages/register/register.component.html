<div class="register-container">
  <div class="glass-bg-overlay"></div>
  <div class="register-card">
    <div class="register-header">
      <div class="logo-icon">📝</div>
      <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
      <p>Trở thành độc giả của thư viện LIBRAHUB</p>
    </div>

    @if (errorMessage()) {
      <div class="alert-box error-alert">
        <span>⚠️ {{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div class="alert-box success-alert">
        <span>✅ {{ successMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="username">Tên đăng nhập <span class="req">*</span></label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              name="username"
              [(ngModel)]="username"
              placeholder="Nhập tên đăng nhập..."
              required
              [disabled]="loading()"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu <span class="req">*</span></label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Nhập mật khẩu..."
              required
              [disabled]="loading()"
            />
            <button
              type="button"
              class="toggle-password-btn"
              (click)="toggleShowPassword()"
              [title]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            >
              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                  <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                  <line x1="2" x2="22" y1="2" y2="22"/>
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="name">Họ và tên <span class="req">*</span></label>
          <div class="input-wrapper">
<!--            <span class="input-icon">📛</span>-->
            <input
              type="text"
              id="name"
              name="name"
              [(ngModel)]="name"
              placeholder="Nhập họ và tên..."
              required
              [disabled]="loading()"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Địa chỉ Email <span class="req">*</span></label>
          <div class="input-wrapper">
<!--            <span class="input-icon">✉️</span>-->
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              placeholder="example@mail.com"
              required
              [disabled]="loading()"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Số điện thoại <span class="req">*</span></label>
          <div class="input-wrapper">
<!--            <span class="input-icon">📞</span>-->
            <input
              type="text"
              id="phone"
              name="phone"
              [(ngModel)]="phone"
              placeholder="Nhập số điện thoại..."
              required
              [disabled]="loading()"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="address">Địa chỉ nhà <span class="req">*</span></label>
          <div class="input-wrapper">
<!--            <span class="input-icon">📍</span>-->
            <input
              type="text"
              id="address"
              name="address"
              [(ngModel)]="address"
              placeholder="Nhập địa chỉ của bạn..."
              required
              [disabled]="loading()"
            />
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span> Đang đăng ký...
        } @else {
          Đăng Ký Tài Khoản
        }
      </button>

      <div class="form-footer">
        <span>Đã có tài khoản? </span>
        <a routerLink="/login">Đăng nhập ngay</a>
      </div>
    </form>
  </div>
</div>
