spring:
  application:
    name: library-management

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=LibraryManagement;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=false
    username: library_user
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    database-platform: org.hibernate.dialect.SQLServerDialect

  sql:
    init:
      mode: always
      encoding: UTF-8

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080

jwt:
  signerKey: "1234567890123456789012345678901234567890123456789012345678901234"

app:
  setup:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}
    librarian:
      username: ${LIBRARIAN_USERNAME:librarian}
      password: ${LIBRARIAN_PASSWORD:librarian123}
