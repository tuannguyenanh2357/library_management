spring:
  application:
    name: library-management

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=LibraryManagement;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
    username: library_user
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true  #hoãn việc chạy các file script SQL khởi tạo cho đến khi hibernate tạo xong schema

    show-sql: true  #in ra console các câu lệnh sql mà hibernate thực thi và định dạng cho dễ đọc(mục đích là debug)

    properties:
      hibernate:
        format_sql: true

    database-platform: org.hibernate.dialect.SQLServerDialect

  sql:
    init:
      mode: always #luôn chạy các file script SQL khởi tạo, các file này nằm trong src/main/resources/sql
      encoding: UTF-8

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 3600000  

